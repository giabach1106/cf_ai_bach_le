<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - Cloudflare Workers</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clear-button {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .clear-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .clear-button:active {
            transform: translateY(0);
        }

        .clear-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .clear-button.clearing {
            background: rgba(255, 193, 7, 0.3);
            border-color: rgba(255, 193, 7, 0.5);
            animation: pulse-clear 1.5s infinite;
        }

        @keyframes pulse-clear {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Cleanup Modal/Overlay */
        .cleanup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .cleanup-overlay.show {
            display: flex;
        }

        .cleanup-modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .cleanup-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .cleanup-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .cleanup-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .cleanup-progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .cleanup-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .cleanup-status {
            font-size: 12px;
            color: #888;
        }

        .tts-toggle {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tts-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .tts-toggle:active {
            transform: translateY(0);
        }

        .tts-toggle.enabled {
            background: rgba(76, 175, 80, 0.3);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .connection-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7f9fc;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            color: #667eea;
        }

        .username.ai {
            color: #764ba2;
        }

        .username.system {
            color: #888;
        }

        .timestamp {
            font-size: 11px;
            color: #999;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            line-height: 1.6;
            max-width: 85%;
        }

        .message.ai .message-content {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
            border-left: 3px solid #764ba2;
        }

        .message.system .message-content {
            background: #f0f0f0;
            font-style: italic;
            color: #666;
            text-align: center;
            max-width: 100%;
        }

        .message-content p {
            margin: 8px 0;
        }

        .message-content code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .message-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .ai-thinking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
            border-radius: 12px;
            color: #764ba2;
            font-style: italic;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #764ba2;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mic-button {
            padding: 12px;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
        }

        .mic-button:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .mic-button:active {
            transform: translateY(0);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-color: #ff4444;
            color: white;
            animation: pulse-mic 1.5s infinite;
        }

        .mic-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes pulse-mic {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(255, 68, 68, 0);
            }
        }

        .error-banner {
            background: #ff4444;
            color: white;
            padding: 12px 24px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .error-banner.show {
            display: block;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 8px;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>🤖 AI Chat Assistant</span>
            <div class="header-actions">
                <button id="ttsToggle" class="tts-toggle" title="Toggle Text-to-Speech">
                    <span id="ttsIcon">🔇</span>
                    <span id="ttsLabel">Off</span>
                </button>
                <button id="clearButton" class="clear-button" disabled>🗑️ Clear Chat</button>
                <div class="connection-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                class="message-input" 
                placeholder="Type a message... (use @ai to ask AI)" 
                disabled
            />
            <button id="micButton" class="mic-button" title="Voice Input" disabled>🎤</button>
            <button id="sendButton" class="send-button" disabled>Send</button>
        </div>
        <div class="help-text">
            💡 Tip: Start your message with <strong>@ai</strong> to ask the AI assistant!
        </div>
    </div>

    <!-- Cleanup Progress Overlay -->
    <div class="cleanup-overlay" id="cleanupOverlay">
        <div class="cleanup-modal">
            <div class="cleanup-icon" id="cleanupIcon">🗑️</div>
            <div class="cleanup-title" id="cleanupTitle">Clearing Chat History</div>
            <div class="cleanup-message" id="cleanupMessage">Please wait...</div>
            <div class="cleanup-progress-bar">
                <div class="cleanup-progress-fill" id="cleanupProgressFill"></div>
            </div>
            <div class="cleanup-status" id="cleanupStatus">0%</div>
        </div>
    </div>

    <script>
        // Configuration
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_HOST = window.location.host;
        
        // State
        let ws = null;
        let roomId = localStorage.getItem('chat_room_id') || '';
        let aiMessages = new Map(); // Track streaming AI messages
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        // Session Isolation: Generate unique room ID per browser session
        // This creates isolated chat rooms for each user
        if (!roomId) {
            roomId = crypto.randomUUID();
            localStorage.setItem('chat_room_id', roomId);
            console.log(`Created new isolated room: ${roomId}`);
        }
        
        // Voice interaction state
        let ttsEnabled = localStorage.getItem('tts_enabled') === 'true';
        let recognition = null;
        let isListening = false;
        let speechRetryCount = 0;
        const MAX_SPEECH_RETRIES = 2;

        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const clearButton = document.getElementById('clearButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const errorBanner = document.getElementById('errorBanner');
        const ttsToggle = document.getElementById('ttsToggle');
        const ttsIcon = document.getElementById('ttsIcon');
        const ttsLabel = document.getElementById('ttsLabel');
        const micButton = document.getElementById('micButton');
        
        // Cleanup modal elements
        const cleanupOverlay = document.getElementById('cleanupOverlay');
        const cleanupIcon = document.getElementById('cleanupIcon');
        const cleanupTitle = document.getElementById('cleanupTitle');
        const cleanupMessage = document.getElementById('cleanupMessage');
        const cleanupProgressFill = document.getElementById('cleanupProgressFill');
        const cleanupStatus = document.getElementById('cleanupStatus');

        // Initialize TTS toggle UI
        function updateTTSUI() {
            if (ttsEnabled) {
                ttsIcon.textContent = '🔊';
                ttsLabel.textContent = 'On';
                ttsToggle.classList.add('enabled');
            } else {
                ttsIcon.textContent = '🔇';
                ttsLabel.textContent = 'Off';
                ttsToggle.classList.remove('enabled');
            }
        }
        updateTTSUI();

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported in this browser');
                micButton.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                micButton.classList.add('listening');
                console.log('Speech recognition started');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log('Recognized:', transcript);
                messageInput.value = transcript;
                speechRetryCount = 0; // Reset retry count on success
                // Auto-submit the message
                setTimeout(() => {
                    sendMessage();
                }, 100);
            };

            recognition.onerror = (event) => {
                // Use warn for expected errors, error for unexpected ones
                if (event.error === 'network' || event.error === 'aborted') {
                    console.warn('Speech recognition:', event.error);
                } else {
                    console.error('Speech recognition error:', event.error);
                }
                
                isListening = false;
                micButton.classList.remove('listening');
                
                if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                    speechRetryCount = 0;
                    showError('🚫 Microphone access denied. Please enable microphone permissions in your browser settings.');
                } else if (event.error === 'no-speech') {
                    speechRetryCount = 0;
                    showError('🔇 No speech detected. Please try again.');
                } else if (event.error === 'network') {
                    // Network errors are common - Google's speech servers may be unreachable
                    speechRetryCount++;
                    if (speechRetryCount <= MAX_SPEECH_RETRIES) {
                        // Silent retry - don't show error on first attempts
                        if (speechRetryCount > 1) {
                            showError(`🌐 Connecting to speech service... (attempt ${speechRetryCount}/${MAX_SPEECH_RETRIES})`);
                        }
                        setTimeout(() => {
                            if (recognition && navigator.onLine) {
                                try {
                                    recognition.start();
                                } catch (e) {
                                    // Already started or other issue - stop retrying
                                    speechRetryCount = 0;
                                }
                            } else {
                                speechRetryCount = 0;
                            }
                        }, 1500 * speechRetryCount); // Exponential backoff
                    } else {
                        speechRetryCount = 0;
                        showError('🌐 Speech recognition unavailable. This may be due to network restrictions or firewall settings. Try typing your message instead.');
                    }
                } else if (event.error === 'aborted') {
                    // Silent - user manually stopped or system interrupted
                    speechRetryCount = 0;
                } else if (event.error === 'audio-capture') {
                    speechRetryCount = 0;
                    showError('🎤 Microphone error: Unable to capture audio. Please check your microphone.');
                } else if (event.error === 'service-not-allowed') {
                    speechRetryCount = 0;
                    showError('🚫 Speech recognition service is not allowed. Please enable it in browser settings.');
                } else {
                    speechRetryCount = 0;
                    showError(`⚠️ Speech recognition error: ${event.error}. Please try again.`);
                }
            };

            recognition.onend = () => {
                isListening = false;
                micButton.classList.remove('listening');
                // Only log if not during retry
                if (speechRetryCount === 0) {
                    console.log('Speech recognition ended');
                }
            };
        }
        initSpeechRecognition();

        // Connect to WebSocket
        function connect() {
            // Include room ID for session isolation (no username needed)
            const wsUrl = `${WS_PROTOCOL}//${WS_HOST}/api/chat?room=${encodeURIComponent(roomId)}`;
            
            console.log(`Connecting to room: ${roomId.substring(0, 8)}...`);
            
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    statusDot.classList.add('connected');
                    statusText.textContent = 'Connected';
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    clearButton.disabled = false;
                    if (recognition) micButton.disabled = false;
                    reconnectAttempts = 0;
                    hideError();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    statusDot.classList.remove('connected');
                    statusText.textContent = 'Disconnected';
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                    clearButton.disabled = true;
                    micButton.disabled = true;

                    // Stop any ongoing speech recognition
                    if (recognition && isListening) {
                        recognition.stop();
                    }

                    // Attempt to reconnect
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        showError(`Connection lost. Reconnecting (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`);
                        setTimeout(connect, 2000 * reconnectAttempts);
                    } else {
                        showError('Connection lost. Please refresh the page.');
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    showError('Connection error occurred');
                };
            } catch (error) {
                console.error('Error creating WebSocket:', error);
                showError('Failed to connect to chat server');
            }
        }

        // Handle incoming messages
        function handleMessage(data) {
            switch (data.type) {
                case 'history':
                    // Load message history
                    data.messages.forEach(msg => displayMessage(msg));
                    break;

                case 'message':
                    // Regular chat message
                    displayMessage(data.message);
                    break;

                case 'ai_thinking':
                    // AI is processing
                    displayAIThinking(data.messageId);
                    break;

                case 'ai_stream':
                    // AI streaming response
                    appendAIStream(data.messageId, data.chunk);
                    break;

                case 'ai_complete':
                    // AI finished streaming
                    completeAIMessage(data.messageId);
                    break;

                case 'ai_error':
                    // AI error
                    displayAIError(data.messageId, data.message);
                    break;

                case 'rag_debug':
                    // RAG debug info
                    displayDebugInfo(data.info);
                    break;

                case 'history_cleared':
                    // History was cleared
                    clearMessagesUI();
                    break;

                case 'error':
                    // General error
                    showError(data.message);
                    break;

                case 'system_message':
                    // System notification (e.g., RAG failures)
                    displaySystemNotification(data.message);
                    break;

                case 'cleanup_progress':
                    // Cleanup progress update
                    updateCleanupProgress(data.status, data.progress, data.message);
                    break;

                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        // Update cleanup progress modal
        function updateCleanupProgress(status, progress, message) {
            cleanupProgressFill.style.width = progress + '%';
            cleanupStatus.textContent = progress + '%';
            cleanupMessage.textContent = message;

            switch (status) {
                case 'starting':
                    cleanupOverlay.classList.add('show');
                    clearButton.classList.add('clearing');
                    clearButton.disabled = true;
                    cleanupIcon.textContent = '🔄';
                    cleanupTitle.textContent = 'Clearing Chat History';
                    break;
                case 'collecting':
                    cleanupIcon.textContent = '🔍';
                    cleanupTitle.textContent = 'Finding Data';
                    break;
                case 'deleting':
                    cleanupIcon.textContent = '🗑️';
                    cleanupTitle.textContent = 'Deleting Vectors';
                    break;
                case 'waiting':
                    cleanupIcon.textContent = '⏳';
                    cleanupTitle.textContent = 'Syncing';
                    break;
                case 'verifying':
                    cleanupIcon.textContent = '✅';
                    cleanupTitle.textContent = 'Verifying';
                    break;
                case 'complete':
                    cleanupIcon.textContent = '🎉';
                    cleanupTitle.textContent = 'Complete!';
                    // Auto-hide after 1.5 seconds
                    setTimeout(() => {
                        cleanupOverlay.classList.remove('show');
                        clearButton.classList.remove('clearing');
                        clearButton.disabled = false;
                    }, 1500);
                    break;
            }
        }

        // Display a chat message
        function displayMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            if (message.username === 'AI Assistant') {
                messageDiv.classList.add('ai');
            } else if (message.username === 'System') {
                messageDiv.classList.add('system');
            }

            const time = new Date(message.timestamp).toLocaleTimeString();
            
            // Render markdown content
            const htmlContent = marked.parse(message.content);

            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="username ${message.username === 'AI Assistant' ? 'ai' : message.username === 'System' ? 'system' : ''}">${escapeHtml(message.username)}</span>
                    <span class="timestamp">${time}</span>
                </div>
                <div class="message-content">${htmlContent}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Display AI thinking indicator
        function displayAIThinking(messageId) {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.id = `ai-msg-${messageId}`;
            thinkingDiv.innerHTML = `
                <div class="message-header">
                    <span class="username ai">AI Assistant</span>
                </div>
                <div class="message-content">
                    <div class="ai-thinking">
                        <span>Thinking</span>
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(thinkingDiv);
            aiMessages.set(messageId, { content: '', element: thinkingDiv });
            scrollToBottom();
        }

        // Append streaming AI content
        function appendAIStream(messageId, chunk) {
            const aiMsg = aiMessages.get(messageId);
            if (!aiMsg) return;

            // Accumulate content
            aiMsg.content += chunk;

            // Render markdown
            const htmlContent = marked.parse(aiMsg.content);

            // Update message content
            const contentDiv = aiMsg.element.querySelector('.message-content');
            contentDiv.innerHTML = htmlContent;

            scrollToBottom();
        }

        // Complete AI message
        function completeAIMessage(messageId) {
            const aiMsg = aiMessages.get(messageId);
            if (aiMsg) {
                // Speak the AI response if TTS is enabled
                if (ttsEnabled && aiMsg.content) {
                    speakText(aiMsg.content);
                }
                aiMessages.delete(messageId);
            }
        }

        // Text-to-Speech function
        function speakText(text) {
            if (!window.speechSynthesis) {
                console.warn('Text-to-Speech not supported in this browser');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            // Remove markdown formatting for better speech
            const cleanText = text
                .replace(/```[\s\S]*?```/g, 'code block')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/\*\*([^*]+)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
                .replace(/#{1,6}\s+/g, '')
                .replace(/\n+/g, '. ');

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Try to select a natural-sounding English voice
            const voices = window.speechSynthesis.getVoices();
            const preferredVoices = voices.filter(voice => 
                voice.lang.startsWith('en') && 
                (voice.name.includes('Natural') || 
                 voice.name.includes('Premium') || 
                 voice.name.includes('Enhanced') ||
                 voice.name.includes('Google') ||
                 voice.name.includes('Microsoft'))
            );
            
            if (preferredVoices.length > 0) {
                utterance.voice = preferredVoices[0];
            } else if (voices.length > 0) {
                const englishVoice = voices.find(voice => voice.lang.startsWith('en'));
                if (englishVoice) utterance.voice = englishVoice;
            }

            utterance.onerror = (event) => {
                console.error('Speech synthesis error:', event);
            };

            window.speechSynthesis.speak(utterance);
        }

        // Display AI error
        function displayAIError(messageId, errorMsg) {
            const aiMsg = aiMessages.get(messageId);
            if (aiMsg) {
                const contentDiv = aiMsg.element.querySelector('.message-content');
                contentDiv.innerHTML = `<span style="color: #ff4444;">❌ ${escapeHtml(errorMsg)}</span>`;
                aiMessages.delete(messageId);
            } else {
                showError(errorMsg);
            }
        }

        // Display RAG debug info
        function displayDebugInfo(info) {
            const debugDiv = document.createElement('div');
            debugDiv.className = 'message system';
            debugDiv.innerHTML = `
                <div class="message-header">
                    <span class="username system">🔧 RAG Debug</span>
                </div>
                <div class="message-content" style="font-family: monospace; font-size: 0.9em; background: #f5f5f5; padding: 8px; border-radius: 4px; white-space: pre-wrap;">${escapeHtml(info)}</div>
            `;
            messagesContainer.appendChild(debugDiv);
            scrollToBottom();
        }

        // Display system notification
        function displaySystemNotification(message) {
            const notifDiv = document.createElement('div');
            notifDiv.className = 'message system';
            notifDiv.innerHTML = `
                <div class="message-header">
                    <span class="username system">System</span>
                    <span class="timestamp">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="message-content">${escapeHtml(message)}</div>
            `;
            messagesContainer.appendChild(notifDiv);
            scrollToBottom();
        }

        // Send message
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ content }));
            messageInput.value = '';
            messageInput.focus();
        }

        // Clear chat history
        function clearChat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (confirm('Are you sure you want to clear all chat history? This will delete all messages and AI context.')) {
                // Show loading immediately
                cleanupOverlay.classList.add('show');
                clearButton.classList.add('clearing');
                clearButton.disabled = true;
                cleanupIcon.textContent = '🔄';
                cleanupTitle.textContent = 'Clearing Chat History';
                cleanupMessage.textContent = 'Please wait...';
                cleanupProgressFill.style.width = '0%';
                cleanupStatus.textContent = '0%';
                
                ws.send(JSON.stringify({ type: 'clear_history' }));
            }
        }

        // Clear messages from UI
        function clearMessagesUI() {
            messagesContainer.innerHTML = '';
            aiMessages.clear();
        }

        // Scroll to bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Show error banner
        function showError(message) {
            errorBanner.textContent = message;
            errorBanner.classList.add('show');
            setTimeout(() => errorBanner.classList.remove('show'), 5000);
        }

        // Hide error banner
        function hideError() {
            errorBanner.classList.remove('show');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        clearButton.addEventListener('click', clearChat);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // TTS toggle event listener
        ttsToggle.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            localStorage.setItem('tts_enabled', ttsEnabled.toString());
            updateTTSUI();
            
            // Cancel any ongoing speech when disabling
            if (!ttsEnabled && window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        });

        // Microphone button event listener
        micButton.addEventListener('click', () => {
            if (!recognition) {
                showError('Speech recognition is not supported in your browser.');
                return;
            }

            // Check if online
            if (!navigator.onLine) {
                showError('🌐 You are offline. Speech recognition requires an internet connection.');
                return;
            }

            if (isListening) {
                recognition.stop();
                speechRetryCount = 0; // Reset retry count
            } else {
                speechRetryCount = 0; // Reset retry count on manual start
                try {
                    recognition.start();
                } catch (error) {
                    console.error('Error starting speech recognition:', error);
                    // Check if already started
                    if (error.message && error.message.includes('started')) {
                        showError('Speech recognition is already active. Please wait.');
                    } else {
                        showError('Failed to start microphone. Please try again.');
                    }
                }
            }
        });

        // Load voices for TTS (they load asynchronously)
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                console.log(`Loaded ${voices.length} TTS voices`);
            };
        }

        // Handle online/offline events for speech recognition
        window.addEventListener('online', () => {
            console.log('Network connection restored');
            if (recognition && ws && ws.readyState === WebSocket.OPEN) {
                micButton.disabled = false;
                micButton.title = 'Voice Input';
            }
        });

        window.addEventListener('offline', () => {
            console.log('Network connection lost');
            if (recognition) {
                micButton.disabled = true;
                micButton.title = 'Voice Input (Offline - requires internet)';
                if (isListening) {
                    recognition.stop();
                }
            }
        });

        // Initialize connection
        connect();
    </script>
</body>
</html>
