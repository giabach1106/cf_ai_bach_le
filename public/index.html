<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Room - Cloudflare Workers</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clear-button {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .clear-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .clear-button:active {
            transform: translateY(0);
        }

        .clear-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .connection-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7f9fc;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            color: #667eea;
        }

        .username.ai {
            color: #764ba2;
        }

        .username.system {
            color: #888;
        }

        .timestamp {
            font-size: 11px;
            color: #999;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            line-height: 1.6;
            max-width: 85%;
        }

        .message.ai .message-content {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
            border-left: 3px solid #764ba2;
        }

        .message.system .message-content {
            background: #f0f0f0;
            font-style: italic;
            color: #666;
            text-align: center;
            max-width: 100%;
        }

        .message-content p {
            margin: 8px 0;
        }

        .message-content code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .message-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .ai-thinking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
            border-radius: 12px;
            color: #764ba2;
            font-style: italic;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #764ba2;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .username-input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            width: 150px;
            transition: border-color 0.3s;
        }

        .username-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-banner {
            background: #ff4444;
            color: white;
            padding: 12px 24px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .error-banner.show {
            display: block;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 8px;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>AI Chat Room</span>
            <div class="header-actions">
                <button id="clearButton" class="clear-button" disabled>🗑️ Clear Chat</button>
                <div class="connection-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-container">
            <input 
                type="text" 
                id="usernameInput" 
                class="username-input" 
                placeholder="Your name" 
                maxlength="20"
            />
            <input 
                type="text" 
                id="messageInput" 
                class="message-input" 
                placeholder="Type a message... (use @ai to ask AI)" 
                disabled
            />
            <button id="sendButton" class="send-button" disabled>Send</button>
        </div>
        <div class="help-text">
            💡 Tip: Start your message with <strong>@ai</strong> to ask the AI assistant anything!
        </div>
    </div>

    <script>
        // Configuration
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_HOST = window.location.host;
        
        // State
        let ws = null;
        let username = localStorage.getItem('chat_username') || '';
        let aiMessages = new Map(); // Track streaming AI messages
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('usernameInput');
        const sendButton = document.getElementById('sendButton');
        const clearButton = document.getElementById('clearButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const errorBanner = document.getElementById('errorBanner');

        // Initialize username input
        usernameInput.value = username;

        // Save username on change
        usernameInput.addEventListener('input', (e) => {
            username = e.target.value.trim() || 'Anonymous';
            localStorage.setItem('chat_username', username);
        });

        // Connect to WebSocket
        function connect() {
            const wsUrl = `${WS_PROTOCOL}//${WS_HOST}/api/chat?username=${encodeURIComponent(username || 'Anonymous')}`;
            
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    statusDot.classList.add('connected');
                    statusText.textContent = 'Connected';
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    clearButton.disabled = false;
                    reconnectAttempts = 0;
                    hideError();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    statusDot.classList.remove('connected');
                    statusText.textContent = 'Disconnected';
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                    clearButton.disabled = true;

                    // Attempt to reconnect
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        showError(`Connection lost. Reconnecting (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`);
                        setTimeout(connect, 2000 * reconnectAttempts);
                    } else {
                        showError('Connection lost. Please refresh the page.');
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    showError('Connection error occurred');
                };
            } catch (error) {
                console.error('Error creating WebSocket:', error);
                showError('Failed to connect to chat server');
            }
        }

        // Handle incoming messages
        function handleMessage(data) {
            switch (data.type) {
                case 'history':
                    // Load message history
                    data.messages.forEach(msg => displayMessage(msg));
                    break;

                case 'message':
                    // Regular chat message
                    displayMessage(data.message);
                    break;

                case 'ai_thinking':
                    // AI is processing
                    displayAIThinking(data.messageId);
                    break;

                case 'ai_stream':
                    // AI streaming response
                    appendAIStream(data.messageId, data.chunk);
                    break;

                case 'ai_complete':
                    // AI finished streaming
                    completeAIMessage(data.messageId);
                    break;

                case 'ai_error':
                    // AI error
                    displayAIError(data.messageId, data.message);
                    break;

                case 'history_cleared':
                    // History was cleared
                    clearMessagesUI();
                    break;

                case 'error':
                    // General error
                    showError(data.message);
                    break;

                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        // Display a chat message
        function displayMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            if (message.username === 'AI Assistant') {
                messageDiv.classList.add('ai');
            } else if (message.username === 'System') {
                messageDiv.classList.add('system');
            }

            const time = new Date(message.timestamp).toLocaleTimeString();
            
            // Render markdown content
            const htmlContent = marked.parse(message.content);

            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="username ${message.username === 'AI Assistant' ? 'ai' : message.username === 'System' ? 'system' : ''}">${escapeHtml(message.username)}</span>
                    <span class="timestamp">${time}</span>
                </div>
                <div class="message-content">${htmlContent}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Display AI thinking indicator
        function displayAIThinking(messageId) {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.id = `ai-msg-${messageId}`;
            thinkingDiv.innerHTML = `
                <div class="message-header">
                    <span class="username ai">AI Assistant</span>
                </div>
                <div class="message-content">
                    <div class="ai-thinking">
                        <span>Thinking</span>
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(thinkingDiv);
            aiMessages.set(messageId, { content: '', element: thinkingDiv });
            scrollToBottom();
        }

        // Append streaming AI content
        function appendAIStream(messageId, chunk) {
            const aiMsg = aiMessages.get(messageId);
            if (!aiMsg) return;

            // Accumulate content
            aiMsg.content += chunk;

            // Render markdown
            const htmlContent = marked.parse(aiMsg.content);

            // Update message content
            const contentDiv = aiMsg.element.querySelector('.message-content');
            contentDiv.innerHTML = htmlContent;

            scrollToBottom();
        }

        // Complete AI message
        function completeAIMessage(messageId) {
            const aiMsg = aiMessages.get(messageId);
            if (aiMsg) {
                aiMessages.delete(messageId);
            }
        }

        // Display AI error
        function displayAIError(messageId, errorMsg) {
            const aiMsg = aiMessages.get(messageId);
            if (aiMsg) {
                const contentDiv = aiMsg.element.querySelector('.message-content');
                contentDiv.innerHTML = `<span style="color: #ff4444;">❌ ${escapeHtml(errorMsg)}</span>`;
                aiMessages.delete(messageId);
            } else {
                showError(errorMsg);
            }
        }

        // Send message
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ content }));
            messageInput.value = '';
            messageInput.focus();
        }

        // Clear chat history
        function clearChat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (confirm('Are you sure you want to clear the chat history? This will delete all messages for everyone.')) {
                ws.send(JSON.stringify({ type: 'clear_history' }));
            }
        }

        // Clear messages from UI
        function clearMessagesUI() {
            messagesContainer.innerHTML = '';
            aiMessages.clear();
        }

        // Scroll to bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Show error banner
        function showError(message) {
            errorBanner.textContent = message;
            errorBanner.classList.add('show');
            setTimeout(() => errorBanner.classList.remove('show'), 5000);
        }

        // Hide error banner
        function hideError() {
            errorBanner.classList.remove('show');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        clearButton.addEventListener('click', clearChat);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize connection
        connect();
    </script>
</body>
</html>
